# Push a tag like v0.2.0 (matching app/src-tauri/tauri.conf.json "version") to publish a release.
# The release carries the NSIS installer plus latest.json, which installed apps poll to self-update.
# Pushes to main run the same build without publishing: tag runs can only read caches made on
# main (or on their own tag), so this keeps the dependency cache warm for the next release.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag must match app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="v$(jq -r .version app/src-tauri/tauri.conf.json)"
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != tauri.conf.json $v"; exit 1; }

      # The tag's CHANGELOG.md section becomes the release page text and latest.json "notes".
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          notes="$(awk -v v="$v" '/^## /{p=($2==v || $2=="v"v); next} p' CHANGELOG.md | sed -e '/./,$!d')"
          [ -n "$(printf '%s' "$notes" | grep -E '^[-*] ')" ] || { echo "CHANGELOG.md has no '## $v' section with items"; exit 1; }
          { echo "RELEASE_NOTES<<__NOTES__"; printf '%s\n' "$notes"; echo "__NOTES__"; } >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      - name: Install UI deps
        working-directory: app
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: bun x @tauri-apps/cli@2.12.5
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Halka ${{ github.ref_name }}
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: false
