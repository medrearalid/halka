[package]
name = "halka"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "halka_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
halka-core = { path = "../../crates/core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
# `#[implement]` (COM callbacks) expands to paths in this crate
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Foundation", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D",
    "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
    "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_Threading",
    "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }
