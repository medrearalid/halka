[package]
name = "halka-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
iroh = "1.4"
iroh-mdns-address-lookup = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
blake3 = "1"
redb = "4"
anyhow = "1"
tracing = "0.1"
bytes = "1"
rand = "0.9"
hex = "0.4"
data-encoding = "2"
image-webp = "0.2"
parking_lot = "0.12"
sonora = "0.3"
opus = "0.4"
cpal = "0.18"
ringbuf = "0.4"
nnnoiseless = { version = "0.5", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse"] }

[features]
# synthetic 440 Hz mic for end-to-end audio tests (input device name "test-tone")
test-tone = []

[dev-dependencies]
halka-core = { path = ".", features = ["test-tone"] }
iroh = { version = "1.4", features = ["unstable-net-report"] }
tempfile = "3"
parking_lot = "0.12"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
